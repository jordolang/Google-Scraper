name: Windows App

# Builds the desktop app into a single .exe on a real Windows runner —
# PyInstaller cannot cross-compile, so this is how a Windows binary gets made
# without a Windows machine. The artifact is attached to the run, and to the
# release when the tag is pushed.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "gui/**"
      - "tui/**"
      - "packaging/**"
      - "email_templates/**"
      - "requirements*.txt"
      - "VERSION"
      - ".github/workflows/windows-build.yml"
  pull_request:
    paths:
      - "gui/**"
      - "packaging/**"
      - "requirements*.txt"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-gui.txt

      - name: Smoke-test the UI offscreen
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests/test_gui.py -q

      - name: Generate icon and version resource
        run: |
          python packaging/make_icon.py
          python packaging/make_version_info.py

      - name: Build LocalLeadScraperPro.exe
        run: pyinstaller --clean --noconfirm packaging/LocalLeadScraperPro.spec

      - name: Check the executable launches
        env:
          LLSP_SELFTEST: "1"
        run: |
          $exe = "dist/LocalLeadScraperPro.exe"
          if (-not (Test-Path $exe)) { throw "the build produced no executable" }
          $size = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "built $exe ($size MB)"
          # --selftest builds the whole window offscreen and exits non-zero on
          # any failure, so a broken bundle fails here rather than on a desk.
          & $exe --selftest
          if ($LASTEXITCODE -ne 0) { throw "self-test failed ($LASTEXITCODE)" }

      - uses: actions/upload-artifact@v4
        with:
          name: LocalLeadScraperPro-windows
          path: dist/LocalLeadScraperPro.exe
          if-no-files-found: error
          retention-days: 90

      - name: Attach the exe to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LocalLeadScraperPro.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
