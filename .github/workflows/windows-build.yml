name: Windows App

# Builds the desktop app into a single .exe on a real Windows runner —
# PyInstaller cannot cross-compile, so this is how a Windows binary gets made
# without a Windows machine. Every run uploads the .exe as an artifact; a run
# that carries a tag also publishes the GitHub release with the .exe attached.
#
# version.yml calls this workflow after it tags a release. That call is the
# path that matters: the tag it pushes uses GITHUB_TOKEN, and GitHub does not
# start new workflow runs for those, so a tag-triggered build would never fire
# on its own. Calling it from inside that same run sidesteps the restriction.

on:
  # Note there is deliberately no `tags:` here. A push trigger's `paths` filter
  # applies to tag pushes too, and a tag push changes no files, so it can never
  # match — a `tags: ["v*"]` entry alongside these paths silently never fires.
  # Every route to a release is spelled out below instead.
  push:
    branches: [main]
    paths: &build_inputs
      # Everything the .exe is built from — the spec bundles the root scraper
      # modules and salescall too, so a change there can break the package.
      - "gui/**"
      - "tui/**"
      - "salescall/**"
      - "packaging/**"
      - "email_templates/**"
      - "run_gui.py"
      - "contact_scraper.py"
      - "google_maps_scraper.py"
      - "phone_lookup.py"
      - "generate_emails.py"
      - "send_emails.py"
      - "data_store.py"
      - "industries.py"
      - "pricing_store.py"
      - "email_config.py"
      - "email_template.html"
      - "pitch_script.md"
      - "requirements*.txt"
      - "VERSION"
      - ".github/workflows/windows-build.yml"
  pull_request:
    paths: *build_inputs
  # Someone publishing a release by hand gets the .exe attached to it.
  release:
    types: [published]
  # ...or build and publish for an existing tag on demand.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish a release for (blank = just build)."
        type: string
        required: false
        default: ""
  # version.yml calls this after it tags a release.
  workflow_call:
    inputs:
      tag:
        description: "Tag to build and publish the release for, e.g. v1.3."
        type: string
        required: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write  # to publish the release
    env:
      # The release this run is for, from whichever route started it; empty on
      # an ordinary push or pull request, which only build the artifact.
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Build the tagged commit itself, not whatever main has moved on to
          # by the time this runs.
          ref: ${{ inputs.tag || github.event.release.tag_name || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-gui.txt

      - name: Smoke-test the UI offscreen
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests/test_gui.py tests/test_gui_flow.py -q

      - name: Scrape a live page with the real browser
        # The runner ships Chrome, and driving it is the app's whole job — the
        # offscreen suite would not have caught a bundle that cannot scrape.
        # Non-blocking: a browser/driver hiccup on the runner must not fail a
        # release, but it is worth seeing in the log.
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
          LLSP_LIVE_TESTS: "1"
        run: pytest tests/test_live_scrape.py -q

      - name: Generate icon, version resource and bundled driver
        run: |
          python packaging/make_icon.py
          python packaging/make_version_info.py
          # Ships inside the .exe so a first run needs no download.
          python packaging/fetch_chromedriver.py --platform win64
          # A silently corrupt or wrong-version download would ship a driver
          # that cannot start, so run it and check it says what we recorded.
          $expected = (Get-Content packaging/drivers/VERSION -Raw).Trim()
          $reported = (& packaging/drivers/chromedriver.exe --version)
          if ($LASTEXITCODE -ne 0) { throw "the bundled chromedriver did not run" }
          Write-Host "bundled: $reported (expected $expected)"
          if ($reported -notmatch [regex]::Escape($expected)) {
            throw "bundled chromedriver is $reported, expected $expected"
          }

      - name: Build LocalLeadScraperPro.exe
        run: pyinstaller --clean --noconfirm packaging/LocalLeadScraperPro.spec

      - name: Check the executable launches
        run: |
          $exe = "dist/LocalLeadScraperPro.exe"
          if (-not (Test-Path $exe)) { throw "the build produced no executable" }
          $size = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "built $exe ($size MB)"

          # --selftest builds every screen offscreen and exits non-zero on any
          # failure, so a broken bundle fails here rather than on someone's desk.
          #
          # Start-Process, not "& $exe": this is a windowed (GUI-subsystem)
          # binary, so the call operator returns immediately without waiting and
          # leaves $LASTEXITCODE empty, which reads as a failure even when the
          # self-test passed.
          $startArgs = @{
            FilePath               = $exe
            ArgumentList           = "--selftest"
            PassThru               = $true
            NoNewWindow            = $true
            RedirectStandardOutput = "selftest-out.txt"
            RedirectStandardError  = "selftest-err.txt"
          }
          $proc = Start-Process @startArgs
          if (-not $proc.WaitForExit(180000)) {
            $proc.Kill()
            throw "self-test did not finish within 3 minutes"
          }
          $out = Get-Content selftest-out.txt -Raw -ErrorAction SilentlyContinue
          $err = Get-Content selftest-err.txt -Raw -ErrorAction SilentlyContinue
          if ($out) { Write-Host $out }
          if ($err) { Write-Host $err }

          $code = $proc.ExitCode
          if ($null -eq $code) {
            # Some Windows/PowerShell combinations do not surface an exit code
            # for a detached GUI process; fall back to the success marker the
            # self-test prints.
            if ($out -and $out.StartsWith("OK")) {
              Write-Host "self-test passed (no exit code reported)"
            } else {
              throw "self-test reported neither an exit code nor an OK marker"
            }
          } elseif ($code -ne 0) {
            throw "self-test failed (exit $code)"
          } else {
            Write-Host "self-test passed"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: LocalLeadScraperPro-windows
          path: dist/LocalLeadScraperPro.exe
          if-no-files-found: error
          retention-days: 90

      - name: Publish the release with the exe attached
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          files: dist/LocalLeadScraperPro.exe
          generate_release_notes: true
          body: |
            ## Local Lead Scraper Pro — Windows

            Download **LocalLeadScraperPro.exe** below and double-click it.
            No installer and no Python needed; Windows 10 or 11, 64-bit.

            Live scraping needs Google Chrome installed. Sending needs an
            app-specific password on the Settings page. Try **Demo mode**
            (Settings → Scraping) first to tour every screen with neither.

            Windows SmartScreen will warn on first run because the .exe is
            unsigned — *More info* → *Run anyway*.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
